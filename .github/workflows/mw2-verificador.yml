name: MW2 PT-BR - validar verificador
on:
  push:
    paths:
      - 'mw2-ptbr/verificar-gamehub.py'
      - 'mw2-ptbr/coletar-base-limpa.py'
      - '.github/workflows/mw2-verificador.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Compilar sintaxe Python
        run: python3 -m py_compile mw2-ptbr/verificar-gamehub.py mw2-ptbr/coletar-base-limpa.py
      - name: Testar diagnostico em arquivos sinteticos
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import tempfile, pathlib, struct, subprocess, sys, zipfile, json, hashlib
          with tempfile.TemporaryDirectory() as tmp:
              p=pathlib.Path(tmp)/"Call of Duty - Modern Warfare 2"/"zone"/"english"
              p.mkdir(parents=True)
              for name in ["common.ff","code_post_gfx.ff","patch.ff","trainer.ff","roadkill.ff"]:
                  (p/name).write_bytes(b"IWffu100"+struct.pack("<I",276)+bytes(9)+b"\x78\x9c"+"synthetic".encode())
              before={x.name:hashlib.sha256(x.read_bytes()).hexdigest() for x in p.iterdir()}
              report=pathlib.Path(tmp)/"report.zip"
              subprocess.run([sys.executable,"mw2-ptbr/verificar-gamehub.py",
                  "--pasta",str(p.parent.parent),"--saida",str(report)],check=True)
              after={x.name:hashlib.sha256(x.read_bytes()).hexdigest() for x in p.iterdir()}
              assert before==after
              with zipfile.ZipFile(report) as z:
                  data=json.loads(z.read("MW2_BASE_NOVA_RELATORIO.json"))
                  assert len(data["files"])==5 and all(x["header_iw4"] for x in data["files"])
                  assert data["translation_applied_by_this_tool"] is False
              print("TESTE PASSOU: nenhum arquivo alterado")
          PY
      - name: Garantir que coletor recuse arquivos desconhecidos sem alteracoes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import tempfile, pathlib, struct, subprocess, sys, hashlib
          with tempfile.TemporaryDirectory() as tmp:
              game=pathlib.Path(tmp)/"Call of Duty - Modern Warfare 2"
              p=game/"zone"/"english"
              p.mkdir(parents=True)
              for name in ["common.ff","code_post_gfx.ff","patch.ff"]:
                  (p/name).write_bytes(b"IWffu100"+struct.pack("<I",276)+bytes(200)+b"synthetic")
              before={x.name:hashlib.sha256(x.read_bytes()).hexdigest() for x in p.iterdir()}
              out=pathlib.Path(tmp)/"sample.zip"
              run=subprocess.run([sys.executable,"mw2-ptbr/coletar-base-limpa.py",
                  "--pasta",str(game),"--saida",str(out)],capture_output=True,text=True)
              assert run.returncode != 0, run.stdout
              assert "base nao confere" in (run.stdout+run.stderr).lower()
              after={x.name:hashlib.sha256(x.read_bytes()).hexdigest() for x in p.iterdir()}
              assert before==after and not out.exists(), "Coletor modificou arquivos ou criou ZIP indevido"
              print("TESTE PASSOU: recusou arquivos diferentes e preservou jogo")
          PY
      - name: Testar ZIP criado e integridade dos tres arquivos
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import tempfile, pathlib, struct, sys, runpy, hashlib, zipfile, json
          with tempfile.TemporaryDirectory() as tmp:
              game=pathlib.Path(tmp)/"Call of Duty - Modern Warfare 2"
              folder=game/"zone"/"english"
              folder.mkdir(parents=True)
              names=["common.ff","code_post_gfx.ff","patch.ff"]
              for i,name in enumerate(names):
                  (folder/name).write_bytes(b"IWffu100"+struct.pack("<I",276)+bytes([i+1])*240)
              hashes={name:hashlib.sha256((folder/name).read_bytes()).hexdigest() for name in names}
              ns=runpy.run_path("mw2-ptbr/coletar-base-limpa.py", run_name="unit_test")
              ns["EXPECTED"].update(hashes)
              out=pathlib.Path(tmp)/"collected.zip"
              old=sys.argv
              try:
                  sys.argv=["coletar-base-limpa.py","--pasta",str(game),"--saida",str(out)]
                  ns["main"]()
              finally:
                  sys.argv=old
              with zipfile.ZipFile(out) as z:
                  assert set(z.namelist()) >= {"base/"+n for n in names}
                  for name in names:
                      assert z.read("base/"+name)==(folder/name).read_bytes()
                  meta=json.loads(z.read("RELATORIO_BASE_LIMPA.json"))
                  assert len(meta["items"])==3
                  assert not meta["changed_game_files"]
              assert hashes=={name:hashlib.sha256((folder/name).read_bytes()).hexdigest() for name in names}
              print("TESTE PASSOU: ZIP correto sem alterar originais")
          PY
