name: Publicar pacote MW2 final 1.0
on:
  push:
    branches: [main]
    paths: ['mw2-upload-final/**']
permissions:
  contents: write
concurrency:
  group: mw2-upload-final
  cancel-in-progress: false
jobs:
  assemble:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Recompor e verificar pacote original
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p mw2-ptbr/download
          cat mw2-upload-final/part-*.bin > mw2-ptbr/download/MW2_PTBR_CAMPANHA_FINAL_1.0.zip
          echo '46c988fb84eb89234c3cee68e21d84977de209517cb81fee2dc93e96d93f5bdd  mw2-ptbr/download/MW2_PTBR_CAMPANHA_FINAL_1.0.zip' | sha256sum -c -
          python3 -c 'import zipfile; z=zipfile.ZipFile("mw2-ptbr/download/MW2_PTBR_CAMPANHA_FINAL_1.0.zip"); assert z.testzip() is None'
      - name: Publicar ZIP e remover partes temporarias
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -r mw2-upload-final
          git add mw2-ptbr/download/MW2_PTBR_CAMPANHA_FINAL_1.0.zip
          git commit -m "Publish verified MW2 campaign PT-BR final 1.0 package"
          git push origin HEAD:main
